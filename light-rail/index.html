<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>LIGHT RAIL FARE</title><link rel="stylesheet" href="../assets/styles.css"></head><body><main class="app">
<header class="header"><div class="brand"><div class="brand-title"><img src="../assets/hk-mtr-logo-exact.png" alt="MTR"><h1 style="font-size:clamp(31px,8.2vw,42px)">LIGHT RAIL</h1></div><div class="low-data" data-i18n="low">低數據模式</div></div><button id="langBtn" class="lang-btn">EN</button></header>
<nav class="service-tabs"><a class="service-tab" href="../" style="display:grid;place-items:center;text-decoration:none" data-i18n="mtr">港鐵 / AEL</a><a class="service-tab active" href="./" style="display:grid;place-items:center;text-decoration:none" data-i18n="lr">輕鐵</a><a class="service-tab" href="../mtr-bus/" style="display:grid;place-items:center;text-decoration:none" data-i18n="bus">港鐵巴士</a></nav>
<h2 class="section-title" data-i18n="select">選擇輕鐵車站</h2><section class="journey-grid"><div class="side"><div class="side-label" data-i18n="from">起點</div><div class="pick-group"><div><div class="pick-label" data-i18n="route">路綫</div><button id="fromRouteBtn" class="picker-btn empty" style="--line-color:#D4A72C"></button></div><div><div class="pick-label" data-i18n="stop">車站</div><button id="fromStopBtn" class="picker-btn station empty" style="--line-color:#D4A72C"></button></div></div></div><div class="swap-column"><button id="swapBtn" class="swap-btn">⇄</button></div><div class="side"><div class="side-label" data-i18n="to">終點</div><div class="pick-group"><div><div class="pick-label" data-i18n="route">路綫</div><button id="toRouteBtn" class="picker-btn empty" style="--line-color:#D4A72C"></button></div><div><div class="pick-label" data-i18n="stop">車站</div><button id="toStopBtn" class="picker-btn station empty" style="--line-color:#D4A72C"></button></div></div></div></section>
<button id="calcBtn" class="calc-btn" data-i18n="calc">計算車費</button><section id="result" class="result-card hidden"><div class="fare-row"><div class="fare-main"><div class="fare-kicker" data-i18n="fare">成人八達通・Audit 車費</div><div id="fareValue" class="fare-value">—</div></div><div><div id="fareRoute" class="fare-route"></div><div id="fareNote" class="fare-note"></div></div></div></section><section class="usage"><span id="uLookup" class="u1">本次 0 B</span><span class="sep">•</span><span id="uUsed" class="u2">已用 0 B</span><span class="sep">•</span><span id="uData" class="u3">數據 0 B</span></section><div class="source" data-i18n="source"></div></main>
<div id="pickerSheet" class="sheet"><div id="sheetBackdrop" class="sheet-backdrop"></div><div class="sheet-panel"><div class="sheet-grab"></div><div class="sheet-head"><strong id="sheetTitle"></strong><button id="sheetClose" class="sheet-close">×</button></div><div id="sheetList" class="sheet-list"></div></div></div><script src="../assets/light-rail.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../service-worker.js').catch(()=>{}))}</script></body></html>

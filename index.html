<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fa"><title>MTR FARE</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="app">
<header class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true"><i></i><b></b></div><div><h1>MTR FARE</h1><div class="mode" data-i18n="mode">低數據模式</div></div></div><button class="lang" id="langBtn">EN</button></header>
<h2 class="section-title" data-i18n="select">選擇車站</h2>
<section class="selector-card" id="fromCard"><div class="selector-head"><strong data-i18n="from">起點</strong><small>FROM</small></div><div class="selector-grid"><div class="field"><label data-i18n="line">路綫</label><div class="select-shell"><span class="line-dot"></span><select id="fromLine"></select></div></div><div class="field"><label data-i18n="station">車站</label><div class="select-shell station"><span class="station-stop"></span><select id="fromStation"></select></div></div></div></section>
<div class="swap-wrap"><button class="swap" id="swap" aria-label="Swap">⇅</button></div>
<section class="selector-card" id="toCard"><div class="selector-head"><strong data-i18n="to">終點</strong><small>TO</small></div><div class="selector-grid"><div class="field"><label data-i18n="line">路綫</label><div class="select-shell"><span class="line-dot"></span><select id="toLine"></select></div></div><div class="field"><label data-i18n="station">車站</label><div class="select-shell station"><span class="station-stop"></span><select id="toStation"></select></div></div></div></section>
<button id="calc" class="calc" data-i18n="calc">計算車費</button>
<section id="result" class="result hidden"><div class="result-inner"><div id="fare" class="fare"></div><div><div id="route" class="route"></div><div id="sub" class="sub"></div><span id="badge" class="badge"></span></div></div></section>
<div class="usage"><span id="uLookup" class="u1">本次 0 B</span><span class="dot">•</span><span id="uUsed" class="u2">已用 0 B</span><span class="dot">•</span><span id="uDb" class="u3">資料庫 0 B</span></div><p id="status" class="status">正在讀取 GitHub 內的車費資料庫…</p>
<section class="map-section"><h2 data-i18n="map">港鐵官方路綫圖</h2><p data-i18n="mapHelp">此處直接使用港鐵官方 PDF 圖像。點地圖車站可設定起點及終點；可放大及拖動。</p><div class="map-card"><div class="map-toolbar"><button id="zoomOut">−</button><button id="zoomIn">＋</button><button id="zoomFit" data-i18n="fit">合適大小</button></div><div class="map-viewport"><div class="map-stage"><img id="officialMap" src="assets/mtr-system-map.png" alt="MTR official system map"><div class="hotspots"></div></div><object id="mapPdfFallback" class="map-fallback" data="assets/mtr-system-map.pdf" type="application/pdf"></object><div id="mapMissing" class="map-missing">The exact MTR official map is stored locally by the GitHub Action on first build.</div></div></div></section>
<nav class="footer"><a href="lite/" data-i18n="lite">無地圖版</a><a href="light-rail/" data-i18n="lr">輕鐵</a><a href="mtr-bus/" data-i18n="bus">港鐵巴士</a></nav><div class="source" data-i18n="source">車費只由此 GitHub repository 內的本地資料庫讀取。</div>
</main><script>window.DB_URL='data/fares-db.json';</script><script src="assets/network.js"></script><script src="assets/app.js"></script><script src="assets/map-hotspots.js"></script><script src="assets/map.js"></script></body></html>

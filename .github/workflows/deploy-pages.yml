name: Build local MTR fare databases and deploy Pages
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/raw/**'
      - 'data/mtr.json'
      - 'data/light-rail.json'
      - 'data/fare/**'
      - 'data/fare-index.json'
      - 'data/ael-fallback.json'
      - 'data/light-rail-stops.json'
      - 'assets/ael-fallback.js'
      - 'assets/light-rail-stops.js'
      - 'assets/mtr-system-map.pdf'
      - 'assets/mtr-system-map.png'
      - 'assets/map-hotspots.js'
  workflow_dispatch:
  schedule:
    - cron: '15 3 5 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MTR snapshots into this repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw assets
          base='https://opendata.mtr.com.hk/data'
          files=(mtr_lines_fares.csv airport_express_fares.csv mtr_lines_and_stations.csv light_rail_fares.csv light_rail_routes_and_stops.csv)
          for f in "${files[@]}"; do
            echo "Downloading $f"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 25 "$base/$f" -o "data/raw/$f"
            test -s "data/raw/$f"
          done
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 25 'https://www.mtr.com.hk/archive/en/services/routemap.pdf' -o assets/mtr-system-map.pdf
          test -s assets/mtr-system-map.pdf
      - name: Build local master databases and low-data per-origin shards
        run: python3 scripts/build_db.py
      - name: Build exact official map image and station click layer
        shell: bash
        run: |
          python3 -m pip install --quiet PyMuPDF
          python3 scripts/build_map_assets.py
          test -s assets/mtr-system-map.png
          test -s assets/map-hotspots.js
          python3 - <<'PY2'
          import re
          from pathlib import Path
          s=Path('assets/map-hotspots.js').read_text(encoding='utf-8')
          n=max(len(re.findall(r"['\"][^'\"]+['\"]\s*:\s*\[",s)), s.count('"cx":'))
          print('verified hotspot count',n)
          assert n >= 80, f'Hotspot layer incomplete: {n}'
          PY2
      - name: Store refreshed snapshots in the repository
        shell: bash
        run: |
          git config user.name 'mtr-fare-db-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/raw data/mtr.json data/light-rail.json data/fare data/fare-index.json data/ael-fallback.json data/light-rail-stops.json assets/ael-fallback.js assets/light-rail-stops.js assets/mtr-system-map.pdf assets/mtr-system-map.png assets/map-hotspots.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update local MTR fare databases and official map [skip ci]'
            git push || echo 'Snapshot push was blocked; continuing Pages deployment with the freshly built local files.'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy only after local databases and map are ready
        id: deployment
        uses: actions/deploy-pages@v4

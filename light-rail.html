<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>LIGHT RAIL FARE</title><link rel="stylesheet" href="assets/styles.css"></head>
<body><main class="app light-page">
<header class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true"><i></i><b></b></div><div class="brandcopy"><h1 data-i18n="title">LIGHT RAIL FARE</h1><div class="mode" data-i18n="mode">低數據模式</div></div></div><button id="langBtn" class="langbtn">EN</button></header>
<p class="hero-sub" data-i18n="subtitle">成人八達通車費・本機查價</p>
<div class="picker-labels"><span data-i18n="from">起點</span><span data-i18n="to">終點</span></div>
<section class="pickers"><div class="select-card"><select id="fromStation"></select></div><button id="swapBtn" class="swap">⇄</button><div class="select-card to"><select id="toStation"></select></div></section>
<button id="calcBtn" class="calc" data-i18n="calculate">計算車費</button>
<section id="result" class="result hidden" aria-live="polite"><div class="result-grid"><div><div id="fareValue" class="fare">$0.0</div></div><div><div id="routeText" class="route"></div><div id="routeSub" class="route-sub"></div><div id="resultBadge" class="badge"></div></div></div></section>
<div class="usage"><span id="usageSearch" class="a">本次查價 0 B</span><span class="dot">•</span><span id="usagePage" class="b">本頁 0 B</span><span class="dot">•</span><span id="usageDb" class="c">車費庫 0 B</span></div><p id="statusText" class="note"></p>
<nav class="footer-links"><a href="map/" data-i18n="back">港鐵車費</a></nav><p class="note" data-i18n="source">資料：港鐵官方 Open Data</p>
</main><script src="assets/light-rail.js"></script></body></html>

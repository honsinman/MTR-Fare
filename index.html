<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MTR Fare"><title>MTR FARE</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="assets/styles.css"></head><body>
<main class="app">
<header class="header"><div class="brand"><div class="brand-title"><img src="icon-192.png" alt="MTR Fare"><h1>MTR FARE</h1></div><div class="low-data" data-i18n="low">低數據模式</div></div><button id="langBtn" class="lang-btn" type="button">EN</button></header>
<nav class="service-tabs"><a class="service-tab active" href="./" data-i18n="mtr">港鐵</a><a class="service-tab" href="light-rail/" data-i18n="lr">輕鐵</a></nav>
<h2 class="section-title" data-i18n="select">選擇車站</h2>
<section class="selector-grid">
 <div class="journey-side"><div class="side-title" data-i18n="from">起點</div><div class="field"><label data-i18n="line">路綫</label><div id="fromLineWrap" class="select-wrap line-select"><select id="fromLine"></select></div></div><div class="field"><label data-i18n="station">車站</label><div id="fromStationWrap" class="select-wrap station-select"><select id="fromStation"></select></div></div></div>
 <div class="swap-column"><button id="swapBtn" class="swap-btn" type="button" aria-label="Swap">⇄</button></div>
 <div class="journey-side"><div class="side-title" data-i18n="to">終點</div><div class="field"><label data-i18n="line">路綫</label><div id="toLineWrap" class="select-wrap line-select"><select id="toLine"></select></div></div><div class="field"><label data-i18n="station">車站</label><div id="toStationWrap" class="select-wrap station-select"><select id="toStation"></select></div></div></div>
</section>
<button id="calcBtn" class="calc-btn" type="button" data-i18n="calc">計算車費</button>
<section id="result" class="result-card hidden"><div class="fare-kicker" data-i18n="fare">成人八達通</div><div id="fareValue" class="fare-value">—</div><div id="fareMsg" class="fare-msg"></div></section>
<section class="usage"><span class="u1"><span data-i18n="now">本次</span> <b id="sessionRequests">0</b></span><i class="sep"></i><span class="u2"><span data-i18n="used">已用</span> <b id="totalRequests">0</b></span><i class="sep"></i><span class="u3"><span data-i18n="data">數據</span> <b id="totalData">0.0 KB</b></span><button id="recountBtn" class="recount-btn" type="button" data-i18n="recount">重計</button></section>
<section class="map-section"><div class="map-heading"><h2 data-i18n="officialMap">港鐵官方路綫圖</h2><small data-i18n="mapHint">官方路綫圖原圖・點車站選擇</small></div><div class="map-card"><div class="map-tools"><button id="zoomOut" type="button">−</button><button id="zoomIn" type="button">＋</button><button id="zoomFit" class="fit" type="button" data-i18n="fit">合適大小</button></div><div class="map-viewport"><div class="map-stage"><img id="officialMap" src="assets/mtr-system-map.png?v=65" loading="lazy" alt="MTR official system map"><div class="hotspots"></div></div></div></div></section>
<div class="source" data-i18n="source">車費只讀取儲存在本 GitHub Pages 的本地資料庫。</div>
</main>
<script>window.MTR_BASE='./'</script><script src="assets/network.js"></script><script src="assets/ael-fallback.js"></script><script src="assets/fare-index.js"></script><script src="assets/mtr-app.js"></script><script src="assets/map-hotspots.js"></script><script src="assets/map.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}</script></body></html>
